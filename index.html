<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedClinic — Navbat Tizimi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#0D9065;--green-dark:#076B4A;--green-light:#E6F7F2;--green-mid:#1DB585;
  --amber:#D97706;--amber-light:#FEF3C7;
  --red:#DC2626;--red-light:#FEE2E2;
  --blue:#2563EB;--blue-light:#EFF6FF;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-400:#9CA3AF;--gray-500:#6B7280;--gray-700:#374151;--gray-900:#111827;
  --white:#FFFFFF;
  --radius:12px;--radius-lg:18px;--radius-xl:24px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh}
input,select,textarea,button{font-family:inherit}

/* ── PAGES ── */
.page{display:none;min-height:100vh}
.page.active{display:flex}

/* ── TOAST ── */
#toast{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{
  padding:12px 18px;border-radius:var(--radius);font-size:14px;font-weight:500;
  box-shadow:var(--shadow-md);animation:slideIn .3s ease;max-width:320px;
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast-item.success{background:#ECFDF5;color:#065F46;border-left:4px solid var(--green)}
.toast-item.error{background:var(--red-light);color:#991B1B;border-left:4px solid var(--red)}
.toast-item.info{background:var(--blue-light);color:#1E40AF;border-left:4px solid var(--blue)}

/* ── CALLING OVERLAY ── */
#callingOverlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8000;
  align-items:center;justify-content:center;
}
#callingOverlay.show{display:flex}
.calling-box{
  background:white;border-radius:var(--radius-xl);padding:48px 56px;text-align:center;
  box-shadow:var(--shadow-lg);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  max-width:420px;width:90%;
}
@keyframes popIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.calling-pulse{
  width:80px;height:80px;border-radius:50%;background:var(--green-light);
  margin:0 auto 20px;display:flex;align-items:center;justify-content:center;
  animation:pulsate 1.2s infinite;
}
@keyframes pulsate{0%,100%{box-shadow:0 0 0 0 rgba(13,144,101,.4)}50%{box-shadow:0 0 0 20px rgba(13,144,101,0)}}
.calling-box h2{font-size:22px;font-weight:700;color:var(--gray-900);margin-bottom:6px}
.calling-box p{color:var(--gray-500);font-size:15px;margin-bottom:24px}
.calling-num{font-family:'Playfair Display',serif;font-size:64px;color:var(--green);line-height:1;margin-bottom:4px}
.btn-close-call{padding:12px 32px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn-close-call:hover{background:var(--green-dark)}
/* ... rest omitted for brevity in this environment ... */
</style>
</head>
<body>
<div id="toast"></div>
<div id="patientPage" class="page active"><div class="patient-card"><h2>MedClinic</h2><p>Navbat tizimi prototipi yuklandi.</p></div></div>
<script>
function init(){}
init();
</script>
</body>
</html>
